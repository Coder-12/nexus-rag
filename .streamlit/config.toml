# .streamlit/config.toml

[theme]
base = "light"
primaryColor = "#111827"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f9fc"
textColor = "#111827"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false
