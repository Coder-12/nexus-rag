OPENAI_API_KEY = "your-openai-api-key"
PINECONE_API_KEY = "your-pinecone-api-key"
PINECONE_INDEX_NAME = "nexus-rag"

# Optional but recommended for primary reranking.
# The app falls back to local reranking if Cohere is unavailable or rate-limited.
COHERE_API_KEY = "..."

# Optional tracing provider.
LANGSMITH_API_KEY = "..."

# Optional: set to "true" only for private debugging.
NEXUS_SHOW_DEBUG = "false"

# Optional latency controls for public deployment.
# Keep rewrite off to avoid an extra LLM round-trip on every answer.
NEXUS_ENABLE_REWRITE = "false"

# OpenAI client latency controls.
NEXUS_OPENAI_TIMEOUT_SECONDS = "20"
NEXUS_OPENAI_MAX_RETRIES = "1"

# Retrieval/rerank latency controls.
NEXUS_MAX_VECTOR_CANDIDATES = "30"
NEXUS_RERANK_CANDIDATES = "50"
NEXUS_RERANK_TOP_K = "16"
NEXUS_FINAL_RETRIEVAL_CANDIDATES = "12"

# Keep local cross-encoder disabled for lower tail latency.
LOCAL_RERANKER_ENABLED = "false"
LOCAL_RERANKER_MAX_DOCS = "20"
